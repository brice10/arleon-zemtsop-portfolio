# Deux profils :
#   dev   → serveur de développement Angular (rechargement à chaud)   http://localhost:4200
#   prod  → aperçu du build de production, tel que déployé sur Vercel  http://localhost:8080
# Le service « cli » donne accès à l'Angular CLI sans rien installer sur la machine.
name: portfolio-v2

x-node: &node
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  # Même utilisateur que sur l'hôte : les fichiers générés (node_modules, ng generate…)
  # vous appartiennent. Valeurs à ajuster dans .env si « id -u » ne renvoie pas 1000.
  user: '${UID:-1000}:${GID:-1000}'
  working_dir: /app
  volumes:
    - .:/app

services:
  dev:
    <<: *node
    profiles: [dev]
    command: npx ng serve --host 0.0.0.0 --port 4200
    ports:
      - '${DEV_PORT:-4200}:4200'

  cli:
    <<: *node
    profiles: [tools]
    command: npx ng version

  preview:
    profiles: [prod]
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    ports:
      - '${PREVIEW_PORT:-8080}:80'
