@let t = i18n.t();

<app-page-hero
  [title]="t.contact.title"
  [lead]="t.contact.lead"
  [crumbs]="[{ label: t.nav.contact }]"
/>

<section class="container-page grid gap-10 pb-20 lg:grid-cols-[1.4fr_1fr]">
  <form
    class="card grid gap-5"
    [action]="contact.formspreeEndpoint"
    method="POST"
    (submit)="submit($event)"
  >
    <label class="grid gap-2 text-sm">
      {{ t.contact.name }}
      <input
        name="name"
        required
        autocomplete="name"
        class="rounded-lg border border-white/10 bg-deep-night px-4 py-3 text-white"
      />
    </label>
    <label class="grid gap-2 text-sm">
      {{ t.contact.email }}
      <input
        name="email"
        type="email"
        required
        autocomplete="email"
        class="rounded-lg border border-white/10 bg-deep-night px-4 py-3 text-white"
      />
    </label>
    <label class="grid gap-2 text-sm">
      {{ t.contact.message }}
      <textarea
        name="message"
        rows="6"
        required
        class="rounded-lg border border-white/10 bg-deep-night px-4 py-3 text-white"
      ></textarea>
    </label>
    <!-- Champ piège anti-spam reconnu par Formspree -->
    <input
      type="text"
      name="_gotcha"
      class="hidden"
      tabindex="-1"
      autocomplete="off"
      aria-hidden="true"
    />

    <button
      type="submit"
      class="btn btn-primary justify-self-start"
      [disabled]="status() === 'sending'"
    >
      {{ status() === 'sending' ? t.contact.sending : t.contact.send }}
    </button>

    <p aria-live="polite" class="text-sm">
      @switch (status()) {
        @case ('success') {
          <span class="text-code-green">{{ t.contact.success }}</span>
        }
        @case ('error') {
          <span class="text-warm-energy">{{ t.contact.error }}</span>
        }
      }
    </p>
  </form>

  <aside class="grid content-start gap-4">
    <a [href]="contact.calendlyUrl" target="_blank" rel="noopener" class="btn btn-ghost"
      >📅 {{ t.contact.bookCall }}</a
    >
    <a [href]="'mailto:' + site.email" class="btn btn-ghost">✉️ {{ site.email }}</a>
    <a [href]="site.social.linkedin" target="_blank" rel="me noopener" class="btn btn-ghost"
      >LinkedIn</a
    >
  </aside>
</section>
