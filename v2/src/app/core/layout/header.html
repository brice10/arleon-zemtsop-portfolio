<header class="sticky top-0 z-40 border-b border-white/5 bg-deep-night/90 backdrop-blur">
  <div class="container-page flex h-16 items-center justify-between gap-4">
    <a
      [routerLink]="i18n.page('home')"
      class="font-display text-xl font-extrabold"
      aria-label="Brice Arléon ZEMTSOP NDADJI"
      (click)="close()"
    >
      <span class="text-white">A</span><span class="text-determination">Z</span>
    </a>

    <nav [attr.aria-label]="i18n.t().a11y.mainNav" class="hidden lg:block">
      <ul class="flex items-center gap-1">
        @for (page of pages; track page) {
          <li>
            <a
              [routerLink]="i18n.page(page)"
              routerLinkActive
              [routerLinkActiveOptions]="{ exact: page === 'home' }"
              ariaCurrentWhenActive="page"
              class="rounded-lg px-3 py-2 font-display text-sm font-medium text-gray-soft hover:text-white aria-[current=page]:text-determination"
              >{{ i18n.t().nav[page] }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-3">
      <ul
        class="flex items-center gap-1 font-mono text-xs"
        [attr.aria-label]="i18n.t().a11y.switchLanguage"
      >
        @for (alt of alternates(); track alt.lang) {
          <li>
            <a
              [routerLink]="alt.link"
              [attr.hreflang]="alt.lang"
              [attr.lang]="alt.lang"
              [attr.aria-current]="alt.lang === i18n.lang() ? 'true' : null"
              class="rounded px-2 py-1"
              [class]="
                alt.lang === i18n.lang()
                  ? 'bg-white/10 text-white'
                  : 'text-gray-light hover:text-white'
              "
              >{{ label(alt.lang) }}</a
            >
          </li>
        }
      </ul>

      <button
        type="button"
        class="rounded-lg p-2 text-white lg:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? i18n.t().a11y.closeMenu : i18n.t().a11y.openMenu"
        (click)="menuOpen.set(!menuOpen())"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </div>

  <nav
    id="mobile-menu"
    [attr.aria-label]="i18n.t().a11y.mainNav"
    class="border-t border-white/5 lg:hidden"
    [class.hidden]="!menuOpen()"
  >
    <ul class="container-page flex flex-col py-3">
      @for (page of pages; track page) {
        <li>
          <a
            [routerLink]="i18n.page(page)"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: page === 'home' }"
            ariaCurrentWhenActive="page"
            class="block rounded-lg px-3 py-3 font-display font-medium text-gray-soft aria-[current=page]:text-determination"
            (click)="close()"
            >{{ i18n.t().nav[page] }}</a
          >
        </li>
      }
    </ul>
  </nav>
</header>
