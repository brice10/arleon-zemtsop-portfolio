<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brice Arléon ZEMTSOP NDADJI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1628" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
    <!-- Thème choisi à la main : appliqué avant le premier affichage pour éviter tout flash.
         Sans choix enregistré, le CSS suit seul le réglage du système. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <!-- Les balises SEO (description, canonical, hreflang, Open Graph, JSON-LD) sont
         générées par SeoService et figées dans le HTML de chaque page au prérendu. -->

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
