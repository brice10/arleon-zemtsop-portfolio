# Équivalent local de vercel.json (aperçu du profil prod uniquement).
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Accueil : langue du navigateur, anglais par défaut
  location = / {
    if ($http_accept_language ~* "^fr") {
      return 307 /fr;
    }
    return 307 /en;
  }

  # Anciennes URL de la v1
  rewrite ^/(fr|en)/pages/professional-experience(\.html)?$ /$1/experience permanent;
  rewrite ^/(fr|en)/pages/([a-z-]+?)(\.html)?$ /$1/$2 permanent;
  rewrite ^/(fr|en)/blog/articles/([a-z0-9-]+?)(\.html)?$ /$1/blog/$2 permanent;
  rewrite ^/(fr|en)/index(\.html)?$ /$1 permanent;
  rewrite ^/(.+)/$ /$1 permanent;

  # Fichiers au nom haché : cache d'un an
  location ~* "^/(main|chunk|styles|polyfills)-[^/]+\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
}
